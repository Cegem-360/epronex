<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Epronex – hero motion test</title>
<!--
  TEMPORARY diagnostic page. Not linked from anywhere, noindex. Delete once the
  hero motion is settled.

  Four strips of the same photo, each moved by a different technique, all
  running at once so a single screen recording captures all four under
  identical conditions. Frame-diffing each strip's band separately says which
  technique the viewer's machine renders continuously and which one it
  quantises to whole pixels.

  A  what the site ships now: CSS scale on a promoted layer
  B  the same scale with no promotion hints at all — a promoted layer can have
     its screen position snapped to whole pixels, an unpromoted one repaints
     sub-pixel, so this is the direct test of that trade-off
  C  a horizontal pan instead of a zoom — translation is the motion compositors
     interpolate most reliably
  D  the same scale as A but four times faster — the control. It has to look
     smooth; if it does not, the capture path is quantising, not the browser.

  Round 2, after the client picked D as the least jarring — which rules out
  promotion (B) and pan (C) and leaves rate as the cause:

  E  the ORIGINAL slow rate, but zoomed by moving the layer along Z under a
     perspective instead of scaling it. A perspective transform cannot be
     resolved to a whole-pixel offset the way a flat one can, so if the stepping
     is pixel snapping this strip escapes it while staying subtle.
  F  the setting about to ship: more travel at roughly D's rate, so it still
     reads as a slow zoom rather than a fast twitch.
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1b1d1a;color:#fff;font:400 14px/1.4 system-ui,sans-serif}
  .strip{position:relative;height:200px;overflow:hidden;border-bottom:2px solid #4c8c3a}
  .frame{position:absolute;inset:-40px 0;background:url(assets/ref-richter.jpg) center center / cover no-repeat}
  .tag{position:absolute;z-index:2;left:16px;top:14px;font:700 13px/1 'Titillium Web',system-ui,sans-serif;
       letter-spacing:1.5px;background:rgba(15,17,14,.82);padding:9px 14px;border-radius:4px}

  @keyframes tScale{from{transform:scale3d(1,1,1)}to{transform:scale3d(1.06,1.06,1)}}
  @keyframes tPan  {from{transform:translate3d(0,0,0)}to{transform:translate3d(-6%,0,0)}}
  /* z of 45px under an 800px perspective works out to the same 1.06 as tScale */
  @keyframes tZ    {from{transform:translate3d(0,0,0)}to{transform:translate3d(0,0,45px)}}
  @keyframes tShip {from{transform:scale3d(1,1,1)}to{transform:scale3d(1.1,1.1,1)}}

  /* A — as shipped */
  .a{will-change:transform;backface-visibility:hidden;animation:tScale 30s linear infinite alternate}
  /* B — identical motion, zero promotion hints */
  .b{animation:tScale 30s linear infinite alternate}
  /* C — pan. wider than the strip so there is room to travel */
  .c{width:112%;will-change:transform;animation:tPan 30s linear infinite alternate}
  /* D — control, 4x the speed of A */
  .d{will-change:transform;backface-visibility:hidden;animation:tScale 7.5s linear infinite alternate}
  /* E — the perspective lives on the strip, the motion on the frame */
  .strip.persp{perspective:800px}
  .e{will-change:transform;backface-visibility:hidden;animation:tZ 30s linear infinite alternate}
  /* F — what index.html is about to ship */
  .f{will-change:transform;backface-visibility:hidden;animation:tShip 13s linear infinite alternate}
</style>
</head>
<body>
  <div class="strip"><span class="tag">A · SCALE, PROMOTED (ahogy most él)</span><div class="frame a"></div></div>
  <div class="strip"><span class="tag">B · SCALE, PROMÓCIÓ NÉLKÜL</span><div class="frame b"></div></div>
  <div class="strip"><span class="tag">C · PAN (oldalirányú mozgás)</span><div class="frame c"></div></div>
  <div class="strip"><span class="tag">D · SCALE 4× GYORSABBAN (kontroll)</span><div class="frame d"></div></div>
  <div class="strip persp"><span class="tag">E · LASSÚ, DE TÉRBELI (perspective)</span><div class="frame e"></div></div>
  <div class="strip"><span class="tag">F · EZ MEGY KI ÉLESBE</span><div class="frame f"></div></div>
</body>
</html>
